<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy | Tiempo de espera agotado</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="/CSS/errores.css">
</head>

<body>

    <main class="error-page">

        <section class="error-card" role="alert" aria-live="polite">

            <div class="error-logo">
                <i class="bi bi-shop"></i>
            </div>

            <p class="error-code">Error 504</p>

            <div class="error-icon">
                <i class="bi bi-hourglass-split"></i>
            </div>

            <h1>Tiempo de espera agotado</h1>

            <p class="error-message">
                El servicio tardó demasiado en responder. Revisa tu conexión
                e inténtalo nuevamente.
            </p>

            <div class="error-actions">
                <a class="btn btn-shopeasy" href="/Index.html">
                    <i class="bi bi-house-door me-2"></i>Ir al inicio
                </a>

                <button type="button" class="btn btn-shopeasy-outline" data-reload>
                    <i class="bi bi-arrow-clockwise me-2"></i>Reintentar
                </button>
            </div>

            <footer class="error-footer">
                <p>ShopEasy &copy; 2026</p>
            </footer>

        </section>

    </main>

    <script src="/JS/api-error.js"></script>

</body>
</html>
